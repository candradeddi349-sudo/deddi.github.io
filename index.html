<!-- Tombol hamburger -->
<div onclick="toggleMenu()" style="font-size:24px;cursor:pointer;">
☰
</div>

<!-- Overlay -->
<div id="overlay" onclick="toggleMenu()" style="
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,0.4);
display:none;
z-index:998;
"></div>

<!-- Sidebar -->
<div id="sidebar" style="
position:fixed;
top:0;left:0;
width:250px;height:100%;
background:#f1f1f1;
padding:20px;
transform:translateX(-100%);
transition:0.3s;
z-index:999;
">

<a href="#">Beranda</a><br><br>
<a href="#">Jadwal & Biaya</a><br><br>
<a href="#">Persyaratan</a><br><br>
<a href="#">Informasi</a><br><br>
<a href="#">Siswa Diterima</a>

</div>

<script>
function toggleMenu(){
  let sidebar = document.getElementById("sidebar");
  let overlay = document.getElementById("overlay");

  if(sidebar.style.transform === "translateX(0%)"){
    sidebar.style.transform = "translateX(-100%)";
    overlay.style.display = "none";
  } else {
    sidebar.style.transform = "translateX(0%)";
    overlay.style.display = "block";
  }
}
</script>
